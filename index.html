function validateResin(value) {
  const r={...value,brand:String(value.brand??'').trim(),name:String(value.name??'').trim(),type:String(value.type??'').trim(),color:String(value.color??'').trim()};
  if(!r.name||!r.brand)throw Error('Informe a marca e o nome da resina.');

  if(r.price===null||r.price===''||!Number.isFinite(Number(r.price))||Number(r.price)<0)throw Error('Confira o preço da resina.');
  if(!Number.isFinite(Number(r.density))||Number(r.density)<=0)throw Error('Informe uma densidade maior que zero.');

function resinPerLiter(resin) {const r=validateResin(resin);return r.unit==='kg'?r.price*r.density:r.price;}

function calculate(q) {

  if(s.pricing==='margin'&&rate>=1) throw Error('A margem sobre venda precisa ser menor que 100%.');
  if(!q.plates?.length) throw Error('Adicione pelo menos um lote.');
  let stl=0,resin=0,machine=0,hours=0,resinModel=0,resinSupports=0,resinOther=0,hasResinSplit=false;
  for(const p of q.plates) {

    const time=number(p.hours,'o tempo do lote');
    let raw;

      const volume=number(p.volume,'o volume de resina');
      const price=number(p.pricePerLiter,'o preço da resina por litro');

    const total=raw*factor*runs;resin+=total;
    const split=p.slicer;

    else resinOther+=total;

  const taskCost=(v,fractional=false)=>number(v.cost,'o custo da tarefa')*number(v.count??1,'a quantidade da tarefa',fractional?0.001:1,!fractional)*(v.basis==='piece'?quantity:1);
  const prep=(q.prep??[]).reduce((sum,v)=>sum+taskCost(v),0);
  const post=Array.isArray(q.postTasks)?q.postTasks.reduce((sum,v)=>sum+taskCost(v),0):number(q.post,'o custo do acabamento')*(q.postMode==='piece'?quantity:1);
  const extras=number(q.extras,'os custos extras')+(q.extraTasks??[]).reduce((sum,v)=>sum+taskCost(v),0);
  const shippingCost=number(q.shippingCost,'o custo de envio');
  const shippingCharge=number(q.shippingCharge,'o frete cobrado');
  const paint=q.paintEnabled?(q.paintTasks??[]).reduce((sum,v)=>sum+taskCost(v,true),0)+number(q.paintExtras??0,'os custos extras da pintura'):0;
  const cost=resin+machine+prep+post+extras+paint+stl;
  const cents=value=>Math.round((value+Number.EPSILON)*100)/100;
  const suggested=cents(Math.max(number(s.minimum,'o pedido mínimo'),s.pricing==='margin'?cost/(1-rate):cost*(1+rate)));
  const chosen=q.finalPrice===null||q.finalPrice===''||q.finalPrice===undefined?suggested:cents(number(q.finalPrice,'o preço final'));
  const revenue=chosen+shippingCharge;
  const profit=revenue-cost-shippingCost;
  const market=q.market===null||q.market===''||q.market===undefined?null:number(q.market,'o preço de mercado')*quantity;
  return {stl,resin,resinModel,resinSupports,resinOther,hasResinSplit,machine,hours,prep,post,extras,paint,cost,suggested,chosen,shippingCost,shippingCharge,total:revenue,

}

// Time is a configurable estimate, independent from the GPU volume calculation.
function estimateSlaHours(layers, p) {
  if (!Number.isInteger(layers) || layers < 1) throw Error('Fatie o modelo antes de calcular o tempo.');
  for (const key of ['normalExposure','bottomExposure','liftHeight','liftSpeed','retractSpeed','restSeconds']) {
    if (!Number.isFinite(p[key]) || p[key] < 0) throw Error('Confira os parâmetros de tempo.');
  }
  if (!Number.isInteger(p.bottomLayers) || p.bottomLayers < 0 || p.liftSpeed <= 0 || p.retractSpeed <= 0) throw Error('Confira as camadas base e as velocidades.');
  const bottom = Math.min(layers, p.bottomLayers);
  const motion = p.liftHeight / p.liftSpeed + p.liftHeight / p.retractSpeed + p.restSeconds;
  return (bottom * p.bottomExposure + (layers - bottom) * p.normalExposure + layers * motion) / 3600;
}

function validateSlicerImport(data) {
  if (!data || data.version !== 1 || data.engine !== 'SliceLab' || data.printer !== 'saturn-3-ultra') throw Error('Use o perfil Elegoo Saturn 3 Ultra.');
  if (!Number.isFinite(data.volumeMl) || data.volumeMl <= 0 || data.volumeMl > 100000) throw Error('O slicer não retornou um volume válido.');
  if (!Number.isInteger(data.layerCount) || data.layerCount < 1 || data.layerCount > 100000) throw Error('Quantidade de camadas inválida.');
  if (!Number.isFinite(data.layerHeight) || data.layerHeight <= 0 || data.layerHeight > 1) throw Error('Altura de camada inválida.');
  const hours = estimateSlaHours(data.layerCount, data.timing);
  if (hours > 10000) throw Error('Confira o tempo estimado.');
  const method=data.method??'slice';if(!['slice','geometry'].includes(method))throw Error('Origem do volume inválida.');
  let modelVolumeMl=null,supportVolumeMl=null;
  if(data.modelVolumeMl!==undefined||data.supportVolumeMl!==undefined){
    modelVolumeMl=data.modelVolumeMl;supportVolumeMl=data.supportVolumeMl;
    if(!Number.isFinite(modelVolumeMl)||modelVolumeMl<0||!Number.isFinite(supportVolumeMl)||supportVolumeMl<0||Math.abs(modelVolumeMl+supportVolumeMl-data.volumeMl)>Math.max(.00001,data.volumeMl*.000001))throw Error('Confira os volumes da peça e dos suportes.');
  }
  if(method==='geometry'&&modelVolumeMl===null)throw Error('A estimativa rápida precisa separar peça e suportes.');
  return {version:1, engine:'SliceLab', printer:'saturn-3-ultra', volumeMl:data.volumeMl, hours,method,modelVolumeMl,supportVolumeMl,
    layerCount:data.layerCount, layerHeight:data.layerHeight, timing:{...data.timing},
    modelNames:(Array.isArray(data.modelNames)?data.modelNames:[]).slice(0,500).map(s=>String(s).slice(0,200)),
    slicedAt:typeof data.slicedAt==='string'?data.slicedAt.slice(0,40):'', importedAt:new Date().toISOString()};
}

const paybackCategories={income:['Venda de impressão','Pintura','Outro recebimento'],expense:['Resina','Álcool / limpeza','Suportes e consumíveis','Tintas / pintura','Embalagem','Energia','Envio','Taxas','Publicidade / anúncios','Manutenção','Outro gasto'],investment:['Impressora','Lavagem / cura','Ferramentas','Outro investimento']};
function paybackReceivables(quotes,entries){
 const paidByQuote=new Map();for(const e of entries)if(!e.voided&&e.type==='income'&&e.quoteId)paidByQuote.set(e.quoteId,(paidByQuote.get(e.quoteId)??0)+Math.round(e.amount*100));
 return quotes.filter(q=>['Aprovado','Em produção','Concluído'].includes(q.status)).map(q=>{const total=Number.isFinite(q.result?.total)&&q.result.total>=0?Math.round(q.result.total*100):null,paid=paidByQuote.get(q.id)??0;return {id:q.id,project:q.project,client:q.client,date:q.date,total:total===null?null:total/100,paid:paid/100,remaining:total===null?null:Math.max(0,total-paid)/100,excess:total===null?0:Math.max(0,paid-total)/100,status:total===null?'Confira o orçamento':paid>total?'Conferir excedente':paid>=total?'Recebido':paid>0?'Parcial':'A receber'};}).sort((a,b)=>(b.date??'').localeCompare(a.date??'')||a.id.localeCompare(b.id));
}
function preparePaybackImport(bundle,{entries=[],quotes=[],asOf}){
 if(bundle?.format!=='nacent-payback-import'||bundle.version!==1||!Array.isArray(bundle.entries)||bundle.entries.length>1000)throw Error('Arquivo de histórico inválido (máximo 1000 lançamentos).');
 const added=[],skipped=[];const key=e=>[e.type,e.date,Math.round(e.amount*100),String(e.description).trim().toLocaleLowerCase()].join('|');
 for(const raw of bundle.entries){
  const candidate=validatePaybackEntry({id:raw.id,date:raw.date,type:raw.type,category:raw.category,description:raw.description,amount:raw.amount,notes:raw.notes??'',quoteId:raw.quoteId??'',voided:false},{asOf,entries:[...entries,...added],quotes});
  const existing=[...entries,...added].find(e=>e.id===candidate.id);
  if(existing){if(key(existing)!==key(candidate))throw Error('Um registro da origem já existe com valores diferentes. Revise antes de importar.');skipped.push(candidate);continue;}
  if([...entries,...added].some(e=>!e.voided&&key(e)===key(candidate))){skipped.push(candidate);continue;}
  added.push({...candidate,updatedAt:new Date().toISOString()});
 }
 const source={name:String(bundle.source?.name??'Histórico importado').slice(0,180)};
 return {added,skipped,source};
}
function paybackDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value??''))throw Error('Informe uma data válida.');const d=new Date(value+'T12:00:00Z');if(!Number.isFinite(+d)||d.toISOString().slice(0,10)!==value)throw Error('Informe uma data válida.');return value;}
const pbCents=value=>Math.round((Number(value)+Number.EPSILON)*100);
const pbDay=value=>new Date(paybackDate(value)+'T12:00:00Z');
const pbISO=d=>d.toISOString().slice(0,10);
function paybackWeek(date){const d=pbDay(date);d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);const start=pbISO(d);d.setUTCDate(d.getUTCDate()+6);return {start,end:pbISO(d)};}
function paybackMonth(month){if(!/^\d{4}-\d{2}$/.test(month??''))throw Error('Escolha um mês válido.');const start=paybackDate(month+'-01'),d=pbDay(start);d.setUTCMonth(d.getUTCMonth()+1,0);return {start,end:pbISO(d)};}
function validatePaybackEntry(raw,{asOf,entries=[],quotes=[]}={}){
 const e={...raw,description:String(raw.description??'').trim(),notes:String(raw.notes??'').trim(),quoteId:String(raw.quoteId??'')};
 if(!e.id||typeof e.id!=='string')throw Error('Identificador do lançamento inválido.');
 if(!paybackCategories[e.type]?.includes(e.category))throw Error('Escolha o tipo e a categoria do lançamento.');
 if(!e.description||e.description.length>180||e.notes.length>1500)throw Error('Informe uma descrição de até 180 caracteres e observações de até 1500.');
 paybackDate(e.date);if(asOf&&e.date>paybackDate(asOf))throw Error('Registre a data em que o dinheiro foi recebido ou pago. Datas futuras não entram no realizado.');
 if(raw.amount===null||raw.amount===''||!Number.isFinite(Number(raw.amount))||Number(raw.amount)<=0||Number(raw.amount)>100000000||pbCents(raw.amount)<1)throw Error('Informe um valor maior que zero, em euros.');
 e.amount=pbCents(raw.amount)/100;e.voided=Boolean(raw.voided);
 if(e.quoteId){
  const q=quotes.find(q=>q.id===e.quoteId);if(e.type!=='income'||!q||!['Aprovado','Em produção','Concluído'].includes(q.status))throw Error('Vincule recebimentos a um orçamento fechado válido.');
  const total=q.result?.total;if(!Number.isFinite(total))throw Error('Confira e salve o orçamento antes de registrar o recebimento.');
  const paid=entries.filter(v=>v.id!==e.id&&!v.voided&&v.type==='income'&&v.quoteId===q.id).reduce((sum,v)=>sum+pbCents(v.amount),0);
  if(!e.voided&&paid+pbCents(e.amount)>pbCents(total))throw Error('O recebimento ultrapassa o saldo deste orçamento. Confira os pagamentos já registrados.');

}
function paybackSummary(entries,asOf){
 paybackDate(asOf);const active=entries.filter(e=>!e.voided&&e.date<=asOf).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
 let income=0,expenses=0,investment=0,balance=0,recoveredAt=null;const days=new Map();
 for(const e of active){paybackDate(e.date);if(!['income','expense','investment'].includes(e.type)||!Number.isFinite(e.amount)||e.amount<=0)throw Error('Há um lançamento inválido no payback.');const amount=pbCents(e.amount);if(e.type==='income')income+=amount;else if(e.type==='expense')expenses+=amount;else investment+=amount;const day=days.get(e.date)??{net:0,investment:0};day.net+=e.type==='income'?amount:-amount;if(e.type==='investment')day.investment+=amount;days.set(e.date,day);}
 let investedSoFar=0;for(const [date,day] of days){investedSoFar+=day.investment;balance+=day.net;if(balance<0)recoveredAt=null;else if(investedSoFar>0&&!recoveredAt)recoveredAt=date;}

}
function paybackPeriod(entries,start,end,asOf){
 paybackDate(start);paybackDate(end);if(start>end)throw Error('Período inválido.');
 const totals=paybackSummary(entries.filter(e=>e.date>=start&&e.date<=end),asOf);
 return {...totals,start,end,closed:end<asOf,status:start>asOf?'Não iniciado':end>=asOf?'Em andamento':totals.operating>0?'Lucro em caixa':totals.operating<0?'Prejuízo em caixa':'Equilíbrio'};

function paybackReports(entries,month,asOf){
 const range=paybackMonth(month),year=month.slice(0,4),months=[],years=[];
 const firstDate=entries.filter(e=>!e.voided&&e.date<=asOf).map(e=>e.date).sort()[0]??asOf,firstMonth=firstDate.slice(0,7);
 const period=(start,end)=>paybackPeriod(entries,start,end>asOf?asOf:end,asOf);
 for(let n=1;n<=12;n++){const m=paybackMonth(year+'-'+String(n).padStart(2,'0'));if(m.start<=asOf&&m.start.slice(0,7)>=firstMonth)months.push(period(m.start,m.end));}
 for(let y=Number(firstDate.slice(0,4));y<=Number(asOf.slice(0,4));y++)years.push(period(y+'-01-01',y+'-12-31'));
 const weeks=[];let date=paybackWeek(range.start).start;
 while(date<=range.end&&date<=asOf){const w=paybackWeek(date);if(w.end>=firstDate)weeks.push(period(w.start,w.end));const d=pbDay(date);d.setUTCDate(d.getUTCDate()+7);date=pbISO(d);}
 return {month:range.start<=asOf?period(range.start,range.end):paybackPeriod([],range.start,range.end,asOf),months,weeks,years};
}

 function reportDashboard(entries,reports,now){
  const modeLabel={weeks:'Semana',months:'Mês',years:'Ano'},rows=reports[reportMode],periods=rows.slice(-12);
  const selected=reportMode==='years'?{start:month.slice(0,4)+'-01-01',end:month.slice(0,4)+'-12-31'}:null;
  const range=selected?paybackPeriod(entries,selected.start,selected.end>now?now:selected.end,now):reports.month;
  const outflow=range.expenses+range.investment,asOf=formatDate(range.end),positive=range.balance>=0;
  const metric=(label,amount,hint,cls='')=>'<article><span>'+label+'</span><strong class="'+cls+'">'+money(amount)+'</strong><small>'+hint+'</small></article>';
  const metrics='<div class="pb-report-metrics">'+metric('Entrou',range.income,'Dinheiro recebido','pb-positive')+metric('Saiu',outflow,'Gastos + equipamentos')+metric('Saldo do período',range.balance,positive?'Entrou mais do que saiu':'Saiu mais do que entrou',positive?'pb-positive':'negative')+'</div>';
  const selectedEntries=entries.filter(e=>!e.voided&&e.date>=range.start&&e.date<=range.end&&e.date<=now);
  const expenses=new Map();for(const e of selectedEntries)if(e.type!=='income'){const key=e.type==='investment'?'Equipamentos / ferramentas':e.category;expenses.set(key,(expenses.get(key)??0)+Math.round(e.amount*100));}
  const categories=[...expenses].sort((a,b)=>b[1]-a[1]),palette=['#1b6e61','#779e8a','#a3bc99','#c9aa77','#8c94ae','#b4bec4'];
  let offset=0;const segments=categories.map(([label,cents],i)=>{const percentage=outflow?cents/(outflow*100)*100:0,start=offset;offset+=percentage;return {label,amount:cents/100,percentage,color:palette[i%palette.length],stop:palette[i%palette.length]+' '+start+'% '+offset+'%'};});
  const distribution=segments.length?'<div class="pb-spending"><div class="pb-donut" role="img" aria-label="Distribuição das saídas por categoria" style="background:conic-gradient('+segments.map(s=>s.stop).join(',')+')"><span><b>'+money(outflow)+'</b><small>total de saídas</small></span></div><ul>'+segments.slice(0,4).map(s=>'<li><i style="background:'+s.color+'"></i><span>'+esc(s.label)+'</span><b>'+money(s.amount)+'</b></li>').join('')+(segments.length>4?'<li class="pb-other">+'+(segments.length-4)+' categorias nos detalhes</li>':'')+'</ul></div>':'<div class="pb-chart-empty">Nenhuma saída registrada neste período.</div>';
  const summary=range.count?range.balance<0?'As saídas superaram os recebimentos em <b>'+money(-range.balance)+'</b> neste período.':'Os recebimentos superaram as saídas em <b>'+money(range.balance)+'</b> neste período.':'Os gráficos aparecem conforme você registra pagamentos e recebimentos.';
  const heading=reportMode==='years'?'Histórico anual':reportMode==='weeks'?'Semanas de '+month.split('-').reverse().join('/'):'Meses de '+month.slice(0,4);
  const mode='<div class="pb-report-switch" role="group" aria-label="Agrupar resumo">'+Object.entries(modeLabel).map(([id,label])=>'<button type="button" aria-pressed="'+(reportMode===id)+'" data-pb-action="report-mode" data-pb-id="'+id+'">'+label+'</button>').join('')+'</div>';
  const label=reportMode==='years'?month.slice(0,4):month.split('-').reverse().join('/');
  return '<div class="pb-report-dashboard"><div class="pb-report-title"><div><h2>Seu caixa, de um jeito simples</h2><p>'+label+' · realizado até '+asOf+'</p></div>'+mode+'</div>'+metrics+'<div class="pb-report-charts"><section class="panel pb-card"><div class="panel-heading"><h2>'+heading+'</h2><div class="pb-chart-legend"><span><i></i>Entrou</span><span><i></i>Saiu</span></div></div>'+cashChart(periods)+(rows.length>12?'<small>Gráfico dos últimos 12 períodos. Histórico completo nos detalhes.</small>':'')+'</section><section class="panel pb-card"><div class="panel-heading"><h2>Para onde foi o dinheiro</h2></div>'+distribution+'</section></div><p class="pb-insight">'+summary+' <span>Gastos: '+money(range.expenses)+' · Equipamentos: '+money(range.investment)+'.</span></p><details class="pb-report-details panel pb-card"><summary>Consultar valores por '+({weeks:'semana',months:'mês',years:'ano'}[reportMode])+'</summary><div class="pb-detail-content"><div class="pb-detail-heading"><p>Somente períodos já iniciados. O período atual vai até hoje.</p>'+button('Exportar CSV','export-report')+'</div>'+reportTable(rows,reportMode)+'</div></details><details class="pb-report-details panel pb-card"><summary>Consultar lançamentos do período <span>'+selectedEntries.length+'</span></summary><div class="pb-detail-content">'+entryTable(selectedEntries.sort(sortEntries))+'</div></details></div>';
 }
 function cashChart(rows){
  if(!rows.length)return '<div class="pb-chart-empty">Nenhum período iniciado.</div>';
  const width=600,height=190,left=45,right=12,top=18,bottom=38,plotH=height-top-bottom,plotW=width-left-right,max=Math.max(1,...rows.map(r=>Math.max(r.income,r.expenses+r.investment))),step=plotW/rows.length,bar=Math.min(25,step*.29);
  let svg='<svg class="pb-cash-chart" viewBox="0 0 '+width+' '+height+'" role="img" aria-label="Comparação dos recebimentos e saídas por período">';
  for(let i=0;i<=2;i++){const value=max*i/2,y=height-bottom-plotH*i/2;svg+='<line x1="'+left+'" y1="'+y+'" x2="'+(width-right)+'" y2="'+y+'" stroke="#e5eae7"/><text x="'+(left-7)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(value)+' €</text>';}
  rows.forEach((r,i)=>{const x=left+step*(i+.5),out=r.expenses+r.investment,label=reportMode==='years'?r.start.slice(0,4):reportMode==='weeks'?r.start.slice(8,10)+'/'+r.start.slice(5,7):r.start.slice(5,7)+'/'+r.start.slice(2,4);
   for(const [value,dx,color] of [[r.income,-bar-2,'#1b6e61'],[out,2,'#d1aa78']]){const h=value/max*plotH;svg+='<rect x="'+(x+dx)+'" y="'+(height-bottom-h)+'" width="'+bar+'" height="'+h+'" rx="3" fill="'+color+'"><title>'+esc(formatDate(r.start)+' a '+formatDate(r.end)+': '+(dx<0?'entrou ':'saiu ')+money(value))+'</title></rect>';}
   svg+='<text x="'+x+'" y="'+(height-bottom+19)+'" text-anchor="middle">'+label+'</text>';
  });return svg+'</svg>';
 }

  document.body.append(dialog);updateEntryFields();dialog.showModal();dialog.addEventListener('cancel',event=>{event.preventDefault();if(!saving&&(!entryDraft._dirty||confirm('Descartar este lançamento não salvo?')))dismiss();});

  dialog.querySelector('form').addEventListener('submit',async event=>{event.preventDefault();if(saving)return;saving=true;dialog.querySelectorAll('button,input,select,textarea').forEach(el=>el.disabled=true);try{const data=getData(),raw={...entryDraft};delete raw._dirty;const valid=validatePaybackEntry(raw,{asOf:today(),entries:data.payback.entries,quotes:data.quotes}),next=structuredClone(data.payback);valid.updatedAt=new Date().toISOString();const i=next.entries.findIndex(e=>e.id===valid.id);if(i<0)next.entries.push(valid);else next.entries[i]=valid;await saveData(next);dismiss();render();toast('Lançamento salvo. Payback e resumos atualizados.');}catch(error){dialog.querySelector('[data-pb-error]').textContent=error.message;}finally{saving=false;dialog?.querySelectorAll('button,input,select,textarea').forEach(el=>el.disabled=false);}});

 const csv=rows=>'\ufeff'+rows.map(row=>row.map(value=>{let s=String(value??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}).join(';')).join('\r\n');

 if(meta.remainingBatches!==null&&meta.remainingBatches!==undefined&&!unknown&&raw.length){if(meta.remainingBatches>raw.length)throw Error('Informe também as horas restantes quando houver mais bandejas que no orçamento.');return {batches:raw.slice(-meta.remainingBatches),unknown:false};}

function planProduction(quotes,state={},nowValue=Date.now()){
 const now=+new Date(nowValue);if(!Number.isFinite(now))throw Error('Data inicial inválida.');const c=validateProductionConfig(state.config??{}),orders=state.orders??{};
 const jobs=quotes.filter(q=>['Aprovado','Em produção'].includes(q.status)).map(q=>{const meta=validateProductionOrder(orders[q.id]??{});let estimate;try{estimate=batchesFromQuote(q,meta);}catch(error){estimate={batches:[],unknown:true,error:error.message};}const due=meta.dueDate?+new Date(meta.dueDate+'T23:59:59'):null,earliest=meta.earliestDate?+new Date(meta.earliestDate+'T00:00:00'):now;return {id:q.id,project:q.project,client:q.client,status:q.status,meta,due,earliest:Math.max(now,earliest),batches:estimate.batches,unknown:estimate.unknown,error:estimate.error,printHours:estimate.unknown?null:round(estimate.batches.reduce((s,h)=>s+h,0)),manualHours:round(meta.prepHours+meta.finishHours),operations:[],start:null,end:null,slackHours:null};}).sort((a,b)=>(a.status==='Em produção'?0:1)-(b.status==='Em produção'?0:1)||(a.due??Infinity)-(b.due??Infinity)||a.earliest-b.earliest||a.id.localeCompare(b.id));
 for(const j of jobs)if(!c.printerAlways&&j.batches.some(h=>h>c.printerEnd-c.printerStart)){j.unknown=true;j.error='Uma bandeja precisa de mais horas contínuas que a janela da impressora. Ajuste a disponibilidade.';}
 const nodes=[];jobs.forEach((j,rank)=>{if(j.unknown)return;let previous=null;const add=(label,resource,hours,kind)=>{const node={id:nodes.length,job:j,rank,label,resource,hours,kind,previous,end:null};nodes.push(node);previous=node;};add('Preparação','human',j.meta.prepHours,'prep');j.batches.forEach((h,i)=>{add('Troca / carga '+(i+1),'human',c.changeMinutes/60,'load');add('Impressão '+(i+1),'machine',h,'print');});if(j.batches.length)add('Retirada / limpeza','human',c.changeMinutes/60,'unload');add('Pintura / acabamento','human',j.meta.finishHours,'finish');});
 const free={human:now,machine:now};let completed=0,machineOwner=null;
 const stageRank=n=>n.kind==='print'?0:n.kind==='unload'?1:n.kind==='load'?2:3;
 while(completed<nodes.length){let best=null;for(const n of nodes){if(n.end!==null||(n.previous&&n.previous.end===null)||(n.kind==='load'&&machineOwner!==null&&machineOwner!==n.job.id))continue;const ready=Math.max(n.job.earliest,n.previous?.end??now,n.hours>0?free[n.resource]:now,n.kind==='load'?free.machine:now),cal=calendar(c,n.resource);let work;
 if(n.kind==='print'){let start=productionNextSlot(ready,cal);if(c.printerAlways)work={start,end:start+n.hours*H,segments:[{start,end:start+n.hours*H}]};else{for(let attempt=0;attempt<3700;attempt++){const edge=new Date(start);edge.setHours(cal.end,0,0,0);if(start+n.hours*H<=+edge){work={start,end:start+n.hours*H,segments:[{start,end:start+n.hours*H}]};break;}start=productionNextSlot(+edge,cal);}if(!work)throw Error('A impressão não cabe na disponibilidade configurada.');}}
 else work=productionWork(ready,n.hours,cal);
 if(!best||work.start<best.work.start||(work.start===best.work.start&&(stageRank(n)<stageRank(best.node)||(stageRank(n)===stageRank(best.node)&&(n.rank<best.node.rank||(n.rank===best.node.rank&&n.id<best.node.id))))))best={node:n,work};}
 if(!best)throw Error('Não foi possível organizar as etapas.');const {node:n,work}=best;n.end=work.end;if(n.kind==='load')machineOwner=n.job.id;if(n.kind==='unload'){machineOwner=null;free.machine=Math.max(free.machine,work.end);}if(n.hours>0){free[n.resource]=work.end;n.job.operations.push({label:n.label,kind:n.kind,resource:n.resource,hours:n.hours,start:work.start,end:work.end,segments:work.segments});}completed++;}

 return {jobs,config:c,now,printHours:round(jobs.reduce((s,j)=>s+(j.printHours??0),0)),manualHours:round(jobs.reduce((s,j)=>s+j.manualHours,0)),end:Math.max(now,...jobs.filter(j=>!j.unknown).map(j=>j.end)),late:jobs.filter(j=>j.slackHours!==null&&j.slackHours<0).length,unknown:jobs.filter(j=>j.unknown).length};
}

 }
 function render(){const {production,quotes}=getData();let p;try{p=planProduction(quotes,production);}catch(err){shell(`<div class="notice error">${e(err.message)}</div>`,'Fila de produção','Confira a disponibilidade.',button('Disponibilidade','config'));return;}

 }
 function dialog(type,id){const {production}=getData(),config={...productionDefaults.config,...production.config},m=production.orders?.[id]??{},q=getData().quotes.find(q=>q.id===id);if(type==='edit'&&!q)return;

class Store {
  constructor() {this.mode='none';this.client=null;this.user=null;this.rows=new Map();}
  get configured() {return Boolean(cloudConfig.url&&cloudConfig.key);}
  async initialize() {
    if(!this.configured)return;
    const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.102.0');
    this.client=createClient(cloudConfig.url,cloudConfig.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const {data,error}=await this.client.auth.getSession();if(error)throw error;
    this.user=data.session?.user??null;
    if(this.user)this.mode='cloud';
  }
  async login(email,password) {
    const {data,error}=await this.client.auth.signInWithPassword({email,password});
    if(error)throw Error('Não foi possível entrar. Confira seu e-mail e senha.');
    this.user=data.user;this.mode='cloud';
  }
  async logout() {if(this.mode==='cloud'){const {error}=await this.client.auth.signOut();if(error)throw error;}this.mode='none';this.user=null;this.rows.clear();}
  demo() {this.mode='demo';this.rows.clear();}
  async load() {
    if(this.mode==='demo')return JSON.parse(localStorage.getItem('resina-demo-v1')||'{"quotes":[],"settings":null}');
    if(this.mode!=='cloud')throw Error('Entre para carregar seus dados.');
    let rows=[];
    for(let offset=0;;offset+=500){
      const {data,error}=await this.client.from('resina_records').select('*').eq('owner_id',this.user.id).order('id').range(offset,offset+499);
      if(error)throw Error('Não foi possível carregar o banco online. Tente atualizar.');
      rows.push(...data);if(data.length<500)break;
    }
    this.rows=new Map(rows.map(r=>[r.id,r]));
    const production=rows.find(r=>r.id==='zz-production'&&r.kind==='settings');
    const payback=rows.find(r=>r.id==='zz-payback'&&r.kind==='settings');
    return {production:production?{...production.payload,revision:production.revision}:null,settings:rows.find(r=>r.id==='settings'&&r.kind==='settings')?.payload??null,quotes:rows.filter(r=>r.kind==='quote').map(r=>({...r.payload,revision:r.revision})),payback:payback?{...payback.payload,revision:payback.revision}:null};
  }
  async save(kind,payload,expectedRevision=0) {
    if(this.mode==='demo') {
      const db=await this.load();
      if(kind==='settings')db.settings=payload;
      else if(kind==='production'){if((db.production?.revision??0)!==expectedRevision)throw Error('A fila mudou em outra aba. Atualize antes de salvar.');db.production={...payload,revision:expectedRevision+1};}
      else if(kind==='payback'){if((db.payback?.revision??0)!==expectedRevision)throw Error('O payback mudou em outra aba. Atualize antes de salvar.');db.payback={...payload,revision:expectedRevision+1};}
      else {const i=db.quotes.findIndex(q=>q.id===payload.id);const next={...payload,revision:expectedRevision+1};if(i<0)db.quotes.push(next);else db.quotes[i]=next;}
      localStorage.setItem('resina-demo-v1',JSON.stringify(db));return expectedRevision+1;
    }
    if(this.mode!=='cloud')throw Error('Entre para salvar online.');
    // Separate private record, using the existing settings kind and owner RLS.
    // The zz prefix also keeps older clients selecting the real settings first.
    if(['payback','production'].includes(kind)&&!this.rows.has('settings'))throw Error('Salve as configurações do ateliê antes do primeiro lançamento.');
    const id=kind==='settings'?'settings':kind==='payback'?'zz-payback':kind==='production'?'zz-production':payload.id;
    const previous=this.rows.get(id);
    const revision=kind==='settings'?(previous?.revision??0):expectedRevision;
    let response;
    if(previous||revision>0) response=await this.client.from('resina_records').update({payload,revision:revision+1}).eq('id',id).eq('owner_id',this.user.id).eq('revision',revision).select();
    else response=await this.client.from('resina_records').insert({id,owner_id:this.user.id,kind:['payback','production'].includes(kind)?'settings':kind,payload,revision:1}).select();
    if(response.error)throw Error('Não foi possível salvar online. Seus campos continuam nesta tela.');
    if(!response.data?.length)throw Error('Este registro mudou em outro aparelho. Atualize antes de continuar.');
    this.rows.set(id,response.data[0]);return response.data[0].revision;
  }
}

ss="header-actions">${buttons}</div></header>${content}<footer class="footer"><span>Nacent</span></footer></main></div>`;

function summaryStats(list=quotes) {
  const sold=list.filter(closed),revenue=sold.reduce((a,q)=>a+quoteTotal(q).total,0),profit=sold.reduce((a,q)=>a+quoteTotal(q).profit,0);
  return `<div class="stats"><article class="stat"><span>Pedidos aprovados</span><strong>${sold.length}</strong><small>Aprovados, em produção ou concluídos</small></article><article class="stat"><span>Receita estimada</span><strong>${money(revenue)}</strong><small>Preço combinado, incluindo frete</small></article><article class="stat"><span>Lucro estimado</span><strong class="${profit<0?'negative':''}">${money(profit)}</strong><small>Após produção e custo do envio</small></article><article class="stat"><span>Aguardando resposta</span><strong>${list.filter(q=>effectiveStatus(q)==='Enviado').length}</strong><small>Orçamentos enviados</small></article></div>`;
}
function badge(status){return `<span class="badge ${status==='Recusado'?'declined':closed({status})?'approved':''}">${esc(status)}</span>`;}
function quoteTable(list) {
  if(!list.length)return `<div class="empty"><span class="empty-symbol">◇</span><h3>${quotes.length?'Nenhum orçamento encontrado':'Seu próximo projeto começa aqui'}</h3><p>${quotes.length?'Experimente outro nome ou status.':'Crie um orçamento e veja os custos e o lucro antes de combinar o preço.'}</p>${action('＋ Criar orçamento','new','btn primary')}</div>`;
  return `<div class="table-scroll"><table><thead><tr><th>PROJETO / CLIENTE</th><th>DATA</th><th>STATUS</th><th>TOTAL</th><th>LUCRO EST.</th><th></th></tr></thead><tbody>${list.map(q=>{const r=quoteTotal(q);return `<tr><td><b>${esc(q.project)}</b><small>${esc(q.client||'Cliente não informado')} · ${q.quantity} peça${q.quantity>1?'s':''}</small></td><td>${fmtDate(q.date)}</td><td>${badge(effectiveStatus(q))}<small>Validade: ${fmtDate(expiryDate(q))}</small></td><td><b>${money(r.total)}</b></td><td class="${r.profit<0?'negative':''}">${money(r.profit)}</td><td><button class="text-btn" data-action="edit" data-id="${q.id}" aria-label="Abrir ${esc(q.project)}">Abrir ↗</button>${closed(q)?`<button type="button" class="text-btn" data-action="quote-payment" data-id="${q.id}">Recebimento</button>`:''}</td></tr>`;}).join('')}</tbody></table></div>`;
}
function render() {
  if(store.mode==='none')return login();
  if(view==='calculator')return renderCalculator();
  if(view==='resins')return renderResins();
  if(view==='settings')return renderSettings();
  if(view==='payback')return paybackUI.render();
  if(view==='production')return productionUI.render();
  if(view==='clients') {
    const clients=new Map();for(const q of quotes){if(q.client){const key=q.client.trim().toLowerCase();if(!clients.has(key))clients.set(key,[]);clients.get(key).push(q);}}
    const cards=[...clients.values()].map(list=>`<article class="client-card"><span class="avatar light">${esc(list[0].client.slice(0,1))}</span><h3>${esc(list[0].client)}</h3><p class="muted">${esc(list.find(q=>q.contact)?.contact||'Sem contato informado')}</p><div class="client-meta"><span>${list.length} orçamento${list.length>1?'s':''}</span><b>${money(list.filter(closed).reduce((a,q)=>a+quoteTotal(q).total,0))}</b></div><button class="text-btn" data-action="client-history" data-id="${esc(list[0].client)}">Ver histórico →</button></article>`).join('');
    return shell(`<div class="client-grid">${cards||'<div class="empty"><h3>Seus clientes aparecem aqui</h3><p>Informe o cliente ao salvar um orçamento para reunir o histórico dele.</p></div>'}</div>`,'Clientes','Clientes e histórico de pedidos.',action('＋ Novo orçamento','new','btn primary'));
  }
  const list=[...quotes].sort((a,b)=>b.date.localeCompare(a.date));
  if(view==='quotes')return shell(`<section class="panel"><div class="filterbar"><label class="search"><span>⌕</span><input id="search" placeholder="Buscar projeto ou cliente" value="${esc(search)}" aria-label="Buscar projeto ou cliente"></label><select id="status-filter" aria-label="Filtrar por status"><option value="">Todos os status</option>${statuses.map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select><span id="count">${quotes.length} registros</span></div><div id="quote-list">${quoteTable(filtered(list))}</div></section>`,'Orçamentos','Consulte, edite ou duplique seus orçamentos.',`${action('Exportar backup','backup')}${action('＋ Novo orçamento','new','btn primary')}`);
  shell(`${summaryStats()}<div class="dashboard-grid"><section class="panel"><div class="panel-heading"><div><h2>Últimos orçamentos</h2><p>Do primeiro cálculo ao pedido concluído.</p></div><button class="text-btn" data-view="quotes">Ver todos →</button></div>${quoteTable(list.slice(0,5))}</section><aside class="tip-card"><p class="eyebrow">PRECIFICAR COM CLAREZA</p><h2>Cada lote tem<br>seu próprio custo.</h2><p>Várias peças na mesma plate compartilham o tempo de máquina. Lotes diferentes podem ter tempos e consumos diferentes.</p><div class="tip-rule">RESINA + TEMPO + TRABALHO</div>${action('Calcular um projeto →','new','btn lime')}</aside></div>`,'Visão geral','Uma visão clara dos projetos e dos resultados.',action('＋ Novo orçamento','new','btn primary'));
}
function filtered(list){return list.filter(q=>(!filter||effectiveStatus(q)===filter)&&`${q.project} ${q.client}`.toLowerCase().includes(search.toLowerCase()));}

function taskEditor(t,group,index,custom=false) {
  const painting=group==='paintTasks';
  return `<div class="task-editor">${custom?input('Descrição da tarefa',`${group}.${index}.name`,t.name,'text','required placeholder="Ex.: Preparação, pintura, montagem…"'):''}<div class="task-fields">${input('Custo (€)',`${group}.${index}.cost`,t.cost,'number','min="0" step="0.01" required')}${input(painting?'Quantidade / horas':'Quantidade da tarefa',`${group}.${index}.count`,t.count??1,'number',painting?'min="0.001" step="any" required':'min="1" step="1" required')}${select('Aplicar custo',`${group}.${index}.basis`,t.basis??'order',[{value:'order',label:'Por pedido'},{value:'piece',label:'Por peça'}])}</div>${custom&&!painting?action('Remover tarefa','remove-task','text-btn',String(index)):''}</div>`;
}
function serviceGroup(group,selected,catalog) {
  const label=group==='prep'?'Adicionar preparação':group==='paintTasks'?'Adicionar tarefa de pintura':'Adicionar pós-processamento';
  return `<div class="task-group"><select class="add-service-select" data-service-group="${group}" aria-label="${label}"><option value="">＋ ${label}</option>${catalog.map((p,i)=>selected.some(t=>t.name===p.name)?'':`<option value="${i}">${esc(p.name)} · ${money(p.cost)}</option>`).join('')}</select><div class="selected-tasks">${selected.map((t,i)=>`<article class="selected-task"><div class="selected-task-header"><b>${esc(t.name)}</b>${action('×','remove-selected','remove-icon',`${group}:${i}`)}</div>${taskEditor(t,group,i,t.custom===true)}</article>`).join('')||'<p class="tasks-empty">Nenhuma tarefa adicionada.</p>'}</div></div>`;
}
function slicerDetails(p) {
  const s=p.slicer;if(!s)return '';const t=s.timing??{};
  const quickNote=p.quickEstimate?`<small>STL sem visualizador · bandeja ${p.quickEstimate.plateIndex+1}/${p.quickEstimate.plateCount} da estimativa</small>${p.quickEstimate.models.map(m=>`<small>${esc(m.name)} · ${m.copies} unidade(s) · medida ${esc(m.options.axis.toUpperCase())}: ${esc(m.options.dimension)} mm · inclinação ${esc(m.options.angle)}° · maciço · geometria do STL · suportes ${esc(m.options.supports)}</small>`).join('')}`:'';
  return `<details class="optional-fields"><summary>${s.method==='geometry'?'Estimativa rápida salva · sem fatiar':'Dados do fatiamento salvo'}</summary>${quickNote}${Number.isFinite(s.modelVolumeMl)?`<small>Peça: ${s.modelVolumeMl.toFixed(3)} ml · Suportes: ${s.supportVolumeMl.toFixed(3)} ml${p.resinSnapshot?' · Peso total estimado: '+(s.volumeMl*p.resinSnapshot.density).toFixed(2)+' g':''}</small>`:''}<small>${esc((s.modelNames??[]).filter(Boolean).join(', ')||'Plate preparada')} · ${esc(s.layerCount)} camadas de ${esc(s.layerHeight)} mm</small><small>Consumo original: ${Number(s.volumeMl).toFixed(3)} ml · Tempo original: ${Number(s.hours).toFixed(3)} h</small><small>Exposição: ${esc(t.normalExposure)} s · Base: ${esc(t.bottomLayers)} camadas × ${esc(t.bottomExposure)} s</small><small>Elevação: ${esc(t.liftHeight)} mm · Subida: ${esc(t.liftSpeed)} mm/s · Retorno: ${esc(t.retractSpeed)} mm/s · Espera: ${esc(t.restSeconds)} s</small><small>Importado em ${esc(new Date(s.importedAt).toLocaleString('pt-PT'))}. ${s.manualOverride?'Valores do lote ajustados manualmente após a importação.':'Valores originais do slicer.'}</small></details>`;
}

function manualResin(p){return p.resinId==='__manual__'||(!p.resinId&&p.pricePerLiter>0);}
function resinSelector(p,i) {
  const catalog=(settings.resins??[]).filter(r=>r.active!==false||r.id===p.resinId);
  if(p.resinSnapshot&&!catalog.some(r=>r.id===p.resinId))catalog.push(p.resinSnapshot);
  return `<label class="field resin-choice"><span>Resina deste lote</span><select data-resin-plate="${i}" aria-label="Resina deste lote"><option value="" ${!p.resinId&&!manualResin(p)?'selected':''} disabled>Selecione uma resina cadastrada</option><option value="__manual__" ${manualResin(p)?'selected':''}>Outra resina · informar preço manual</option>${catalog.map(r=>{const shown=r.id===p.resinId&&p.resinSnapshot?p.resinSnapshot:r;return `<option value="${esc(r.id)}" ${r.id===p.resinId?'selected':''}>${esc(shown.brand)} · ${esc(shown.name)} · ${money(shown.price)}/${shown.unit==='kg'?'kg':'litro'}</option>`;}).join('')}</select></label>${p.resinSnapshot?`<small class="resin-price-note">${money(p.resinSnapshot.price)}/${p.resinSnapshot.unit==='kg'?'kg':'litro'} · densidade ${p.resinSnapshot.density.toFixed(3).replace('.',',')} g/ml · preço guardado neste orçamento</small>`:''}`;
}
function paintingPanel(q,title) {
  return `<section class="panel form-panel painting-panel">${title('3','Pintura','Tarefas e materiais da pintura ficam separados da impressão.')}<label class="paint-toggle"><input type="checkbox" name="paintEnabled" ${q.paintEnabled?'checked':''}><span>Incluir pintura no orçamento</span></label>${q.paintEnabled?`<div class="painting-body"><h3 class="task-title">Tarefas e custos da pintura</h3>${serviceGroup('paintTasks',q.paintTasks??[],settings.paint??[])}<div class="custom-task-controls">${action('＋ Tarefa personalizada de pintura','add-paint-task','btn secondary')}${input('Tintas, verniz e outros custos por pedido (€)','paintExtras',q.paintExtras??0,'number','min="0" step="0.01" required')}</div><small class="muted">Use “Por peça” para aplicar à quantidade do orçamento. Quantidade / horas aceita valores como 0,5 ou 2,5.</small></div>`:'<p class="tasks-empty">Ative para adicionar pintura a este projeto.</p>'}</section>`;
}
function renderResins() {
  const catalog=settings.resins??[],active=catalog.filter(r=>r.active!==false);

  shell(`<div class="resin-management"><section class="panel"><div class="panel-heading"><div><h2>Suas resinas</h2><p>Preços e disponibilidade salvos na sua conta.</p></div><span>${active.length} ativa${active.length===1?'':'s'}</span></div><label class="field resin-default"><span>Resina padrão para novos lotes</span><select id="resin-default"><option value="">Escolher no orçamento</option>${active.map(r=>`<option value="${esc(r.id)}" ${settings.defaultResinId===r.id?'selected':''}>${esc(r.brand)} · ${esc(r.name)}</option>`).join('')}</select></label>${table}<p class="inventory-note">Informe o stock disponível manualmente. Fazer um orçamento não baixa o stock. Alterar um preço não muda orçamentos já salvos.</p></section>${editor}</div>`,'Resinas','Cadastre e edite as resinas que você usa na impressão.',action('＋ Adicionar resina','new-resin','btn primary'));
  updateResinConversion();
}
function updateResinConversion() {
  const el=document.getElementById('resin-conversion');if(!el||!resinDraft)return;
  try{el.textContent=`Preço para o cálculo: ${resinPerLiter(resinDraft).toFixed(4).replace('.',',')} €/litro${resinDraft.unit==='kg'?' (preço/kg × densidade)':''}.`;}catch{el.textContent='Preencha nome, marca, preço e densidade para conferir o custo por litro.';}
}
async function saveResinSettings(next,message) {
  await store.save('settings',next);settings=next;settingsDraft=null;dirty=false;toast(store.mode==='cloud'?message:'Salvo nesta demonstração local.');
}
async function saveResin() {
  if(busy)return;busy=true;
  try{const r=validateResin(resinDraft),next=clone(settings);next.resins??=[];const i=next.resins.findIndex(x=>x.id===r.id);if(i<0)next.resins.push(r);else next.resins[i]=r;await saveResinSettings(next,'Resina salva online.');resinDraft=null;renderResins();}catch(e){toast(e.message);}finally{busy=false;}

// Presentation state only. Quote values, pricing and persistence remain unchanged.
let workspaceQuoteId='',workspaceStep=0,workspacePrintTab='plates',workspacePlate=0;
let workspaceSettingsTab=0;
let workspaceValidationActive=false;
const workspaceSteps=['Projeto','Impressão','Pintura','Preço'];
function setSettingsTab(index){
  workspaceSettingsTab=index;
  document.querySelectorAll('[data-settings-panel]').forEach(el=>{el.hidden=Number(el.dataset.settingsPanel)!==index;});
  document.querySelectorAll('[data-settings-tab]').forEach(el=>el.setAttribute('aria-pressed',String(Number(el.dataset.settingsTab)===index)));
}
function mountSettingsUI(){
  const form=document.querySelector('#settings-form');if(!form)return;
  form.classList.add('settings-workspace');
  form.querySelectorAll('.form-panel').forEach((panel,i)=>{panel.dataset.settingsPanel=i;});
  form.insertAdjacentHTML('afterbegin',`<div class="print-tabs settings-tabs" aria-label="Áreas das configurações">${['Ateliê','Custos padrão','Tabela de tarefas'].map((name,i)=>`<button type="button" data-settings-tab="${i}">${name}</button>`).join('')}</div>`);
  setSettingsTab(workspaceSettingsTab);
}
function setWorkspaceStep(step,focus=false){
  workspaceStep=Math.max(0,Math.min(3,step));
  document.querySelectorAll('[data-workspace-panel]').forEach(el=>{el.hidden=Number(el.dataset.workspacePanel)!==workspaceStep;});
  document.querySelectorAll('[data-workspace-step]').forEach(el=>{const active=Number(el.dataset.workspaceStep)===workspaceStep;el.setAttribute('aria-selected',String(active));el.tabIndex=active?0:-1;});
  const back=document.querySelector('[data-workspace-prev]'),next=document.querySelector('[data-workspace-next]');
  if(back)back.disabled=workspaceStep===0;
  if(next){next.hidden=workspaceStep===3;next.textContent=`${workspaceSteps[workspaceStep+1]??''} →`;}
  const caption=document.querySelector('.workspace-progress');if(caption)caption.textContent=`${workspaceStep+1} de 4`;
  if(focus)document.querySelector(`[data-workspace-step="${workspaceStep}"]`)?.focus();
}
function setPrintTab(tab){
  workspacePrintTab=tab;
  document.querySelectorAll('[data-print-panel]').forEach(el=>{el.hidden=el.dataset.printPanel!==tab;});
  document.querySelectorAll('[data-print-tab]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.printTab===tab)));
}
function setWorkspacePlate(index){
  workspacePlate=index;
  document.querySelectorAll('[data-workspace-plate]').forEach(el=>{el.hidden=Number(el.dataset.workspacePlate)!==index;});
}
function mountCalculatorUI(){
  if(workspaceQuoteId!==draft.id){workspaceQuoteId=draft.id;workspaceStep=0;workspacePrintTab='plates';workspacePlate=0;}
  const form=document.querySelector('#quote-form'),stack=form.querySelector('.form-stack');
  form.classList.add('workspace-form');
  form.insertAdjacentHTML('afterbegin',`<div class="workspace-tabs" role="tablist" aria-label="Etapas do orçamento">${workspaceSteps.map((label,i)=>`<button type="button" role="tab" id="workspace-tab-${i}" aria-controls="workspace-panel-${i}" data-workspace-step="${i}"><span>${i+1}</span>${label}</button>`).join('')}</div>`);
  ['project-panel','plates-panel','painting-panel','price-panel'].forEach((cls,i)=>{const panel=stack.querySelector('.'+cls);panel.dataset.workspacePanel=i;panel.id=`workspace-panel-${i}`;panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby',`workspace-tab-${i}`);});
  stack.insertAdjacentHTML('beforeend','<div class="workspace-bottom"><button type="button" class="btn secondary" data-workspace-prev>← Anterior</button><span class="workspace-progress"></span><button type="button" class="btn primary" data-workspace-next></button></div>');
  const printing=stack.querySelector('.plates-panel'),tasks=printing.querySelector('.printing-tasks');
  const plates=document.createElement('div');plates.dataset.printPanel='plates';
  [...printing.children].filter(el=>el.classList.contains('plate')||el.classList.contains('plate-footer')).forEach(el=>plates.append(el));
  printing.insertBefore(plates,tasks);tasks.dataset.printPanel='tasks';tasks.open=true;tasks.querySelector('summary').hidden=true;
  printing.querySelector('.section-title').insertAdjacentHTML('afterend','<div class="print-tabs" aria-label="Controles da impressão"><button type="button" data-print-tab="plates">Bandejas</button><button type="button" data-print-tab="tasks">Tarefas e custos</button></div>');
  const plateNodes=plates.querySelectorAll('.plate');
  if(workspacePlate>=plateNodes.length)workspacePlate=plateNodes.length-1;
  plateNodes.forEach((el,i)=>{el.dataset.workspacePlate=i;});
  if(plateNodes.length>1){plates.insertAdjacentHTML('afterbegin',`<label class="field lot-switch"><span>Bandeja / lote</span><select data-workspace-lot aria-label="Bandeja / lote">${draft.plates.map((p,i)=>`<option value="${i}" ${i===workspacePlate?'selected':''}>${esc(p.label)} · ${p.runs} repetição${p.runs===1?'':'ões'}</option>`).join('')}</select></label>`);}
  setWorkspaceStep(workspaceStep);setPrintTab(workspacePrintTab);setWorkspacePlate(workspacePlate);

document.addEventListener('click',event=>{
  const settingsTab=event.target.closest('[data-settings-tab]');if(settingsTab){setSettingsTab(Number(settingsTab.dataset.settingsTab));return;}
  const step=event.target.closest('[data-workspace-step]');if(step){setWorkspaceStep(Number(step.dataset.workspaceStep));return;}
  if(event.target.closest('[data-workspace-next]')){setWorkspaceStep(workspaceStep+1,true);return;}
  if(event.target.closest('[data-workspace-prev]')){setWorkspaceStep(workspaceStep-1,true);return;}
  const printTab=event.target.closest('[data-print-tab]');if(printTab){setPrintTab(printTab.dataset.printTab);return;}
  if(event.target.closest('[data-action="add-plate"]'))workspacePlate=draft.plates.length;
  if(event.target.closest('[data-action="add-task"],[data-action="remove-task"],[data-action="remove-selected"]')&&view==='calculator')setPrintTab(workspacePrintTab);
});
document.addEventListener('change',event=>{if(event.target.matches('[data-workspace-lot]'))setWorkspacePlate(Number(event.target.value));});
document.addEventListener('keydown',event=>{const tab=event.target.closest('[data-workspace-step]');if(!tab)return;const keys={ArrowRight:workspaceStep+1,ArrowLeft:workspaceStep-1,Home:0,End:3};if(event.key in keys){event.preventDefault();setWorkspaceStep(keys[event.key],true);}});
// Reveal hidden fields before the browser focuses a validation error.
document.addEventListener('invalid',event=>{if(workspaceValidationActive)return;workspaceValidationActive=true;queueMicrotask(()=>{workspaceValidationActive=false;});const settingsPanel=event.target.closest('[data-settings-panel]');if(settingsPanel)setSettingsTab(Number(settingsPanel.dataset.settingsPanel));const panel=event.target.closest('[data-workspace-panel]');if(!panel)return;setWorkspaceStep(Number(panel.dataset.workspacePanel));const printing=event.target.closest('[data-print-panel]');if(printing)setPrintTab(printing.dataset.printPanel);const plate=event.target.closest('[data-workspace-plate]');if(plate){setWorkspacePlate(Number(plate.dataset.workspacePlate));const select=document.querySelector('[data-workspace-lot]');if(select)select.value=workspacePlate;}event.target.closest('details')?.setAttribute('open','');},true);

rete.':'Custo ÷ (1 − percentual). A margem é a parcela do preço de venda que sobra após os custos.'}</p></details>`;

function setPath(target,path,value) {const keys=path.split('.');let parent=target;for(const k of keys.slice(0,-1))parent=parent[k];parent[keys.at(-1)]=value;}
function openSlicer(index) {

  document.body.append(dialog);slicerSession={dialog,index,quoteId:draft.id,token,result:null,popup:null};
  dialog.addEventListener('close',()=>{if(slicerSession?.popup&&!slicerSession.popup.closed)slicerSession.popup.close();dialog.remove();slicerSession=null;});dialog.showModal();

function openQuickQuote(index){
 if(!draft?.plates[index])return;
 const quoteId=draft.id;
 openQuickEstimator({index,plate:clone(draft.plates[index]),money,escape:esc,defaultUpdateQuantity:draft.plates.length===1,onApply:({index,plan,updateQuantity})=>{
  if(draft.id!==quoteId||!draft.plates[index])throw Error('Reabra a estimativa neste orçamento.');
  const base=draft.plates[index];
  const plates=plan.batches.map((batch,i)=>{
   const payload=validateSlicerImport({version:1,engine:'SliceLab',printer:'saturn-3-ultra',method:'geometry',modelVolumeMl:batch.modelVolumeMl,supportVolumeMl:batch.supportVolumeMl,volumeMl:batch.volumeMl,layerCount:batch.layerCount,layerHeight:plan.timing.layerHeight,timing:plan.timing,modelNames:batch.pieces.map(p=>p.name),slicedAt:new Date().toISOString()});
   return {...clone(base),stlCost:i===0?(base.stlCost??0):0,label:plan.batches.length===1?base.label:`${base.label} · bandeja ${i+1}`,runs:1,volume:payload.volumeMl,hours:payload.hours,resinMode:'volume',slicer:payload,quickEstimate:{version:1,method:'geometry-supports',timing:plan.timing,models:plan.models.map(({name,dimensions,modelVolumeMl,supportVolumeMl,supportCount,copies,options,warnings,sourceWarnings,volumeCheck})=>({name,dimensions,modelVolumeMl,supportVolumeMl,supportCount,copies,options,warnings,sourceWarnings,volumeCheck})),plateIndex:i,plateCount:plan.batches.length,estimatedAt:new Date().toISOString()}};
  });
  draft.plates.splice(index,1,...plates);if(updateQuantity)draft.quantity=plan.pieces;dirty=true;workspacePlate=index;workspaceStep=1;workspacePrintTab='plates';render();toast('Estimativa aplicada: consumo e tempo separados por bandeja. Confira a resina selecionada.');
 }});
}
function applyPreparedResult(s){
  const p=draft.plates[s.index];if(!p||s.quoteId!==draft.id)throw Error('Abra a preparação deste orçamento novamente.');
  p.volume=s.result.volumeMl;p.hours=s.result.hours;p.resinMode='volume';p.slicer=clone(s.result);dirty=true;
  s.dialog.close();render();toast(s.result.method==='geometry'?'Peça e suportes aplicados diretamente, sem fatiar. Selecione a resina deste lote.':'Fatiamento aplicado ao lote.');

window.addEventListener('message',event=>{
  const s=slicerSession;if(!s||event.origin!==location.origin||(event.source!==s.dialog.querySelector('iframe').contentWindow&&event.source!==s.popup)||event.data?.token!==s.token)return;
  if(event.data.type==='nacent-slicer-invalid'){s.result=null;s.dialog.querySelector('[data-action="apply-slicer"]').disabled=true;s.dialog.querySelector('#slicer-preview').textContent='A preparação mudou. Clique em Usar bandeja no orçamento para atualizar os valores.';return;}
  if(event.data.type!=='nacent-slicer-result')return;
  try {s.result=validateSlicerImport(event.data.payload);if(s.result.method==='geometry'){applyPreparedResult(s);return;}s.dialog.querySelector('#slicer-preview').textContent=`${s.result.volumeMl.toFixed(3)} ml (inclui suportes) · ${s.result.hours.toFixed(2)} h estimadas · ${s.result.layerCount} camadas. O fator de perdas do orçamento continua aplicado.`;s.dialog.querySelector('[data-action="apply-slicer"]').disabled=false;}
  catch(error){s.result=null;s.dialog.querySelector('#slicer-preview').textContent=error.message;s.dialog.querySelector('[data-action="apply-slicer"]').disabled=true;}
});
function absorbQuoteField(target) {
  const slicedField=target.name.match(/^plates\.(\d+)\.(volume|hours|resinMode)$/);if(slicedField&&draft.plates[Number(slicedField[1])].slicer)draft.plates[Number(slicedField[1])].slicer.manualOverride=true;
  if(target.name==='task-choice'){
    const group=target.dataset.group,index=Number(target.value),catalog=group==='prep'?draft.settings.prep:draft.settings.post;
    draft[group]??=[];
    if(target.checked&&!draft[group].some(x=>x.name===catalog[index].name))draft[group].push({...clone(catalog[index]),count:1,basis:'order'});
    if(!target.checked)draft[group]=draft[group].filter(x=>x.name!==catalog[index].name);
  }
  else if(target.name){const value=target.type==='number'?(target.value===''?null:Number(target.value)):target.type==='checkbox'?target.checked:target.value;setPath(draft,target.name,value);}
  const labelField=target.name.match(/^plates\.(\d+)\.label$/);if(labelField){const option=document.querySelector('[data-workspace-lot] option[value="'+labelField[1]+'"]');if(option){const p=draft.plates[Number(labelField[1])];option.textContent=(p.label.trim()||'Lote '+(Number(labelField[1])+1))+' · '+p.runs+' repetição'+(p.runs===1?'':'ões');}}
  dirty=true;updateResult();
}

async function saveQuote(finalize=true) {
  if(busy)return;
  try {
    const pending=clone(draft);if(finalize&&pending.status==='Rascunho')pending.status='Enviado';
    const result=validateQuote(pending);busy=true;updateResult();
    const payload={...pending,project:pending.project.trim(),client:pending.client.trim(),result,updatedAt:new Date().toISOString()};
    const revision=await store.save('quote',payload,draft.revision);
    payload.revision=revision;const i=quotes.findIndex(x=>x.id===payload.id);if(i<0)quotes.push(payload);else quotes[i]=payload;
    draft=payload;dirty=false;view='quotes';render();toast(store.mode==='cloud'?'Orçamento salvo online.':'Orçamento salvo nesta demonstração local.');
  }catch(error){toast(error.message);}finally{busy=false;}
}

const paybackUI=createPaybackUI({getData:()=>({payback,quotes}),saveData:async next=>{if(store.mode==='cloud'&&!store.rows.has('settings'))await store.save('settings',settings);const revision=await store.save('payback',next,payback.revision??0);payback={...next,revision};},shell,money,escape:esc,today,toast,download,setDirty:value=>{dirty=value;}});
async function refresh() {
  if(dirty&&!confirm('Você tem alterações não salvas. Descartar e atualizar os dados?'))return;
  try {const db=await store.load();settings=db.settings?{...clone(defaults),...db.settings}:clone(defaults);quotes=db.quotes;production=db.production??clone(productionDefaults);payback=db.payback??{version:1,entries:[],source:null,revision:0};dirty=false;view=['payback','production'].includes(view)?view:'calculator';draft=newQuote(settings);draft.postTasks=settings.post.length?[{...clone(settings.post[0]),count:1,basis:'order'}]:[];render();}catch(error){toast(error.message);}
}
function leave(){return !dirty||confirm('Há alterações não salvas. Descartar essas alterações?');}
setInterval(()=>{if(store.mode!=='none'&&['dashboard','quotes','clients'].includes(view))render();},60000);
document.addEventListener('click',async event=>{
  const pr=event.target.closest('[data-pr-action]');if(pr){await productionUI.action(pr.dataset.prAction,pr.dataset.prId);return;}
  const pb=event.target.closest('[data-pb-action]');if(pb){await paybackUI.action(pb.dataset.pbAction,pb.dataset.pbId);return;}
  const nav=event.target.closest('[data-view]');if(nav){if(leave()){view=nav.dataset.view;dirty=false;settingsDraft=null;resinDraft=null;if(view==='calculator'){draft=newQuote(settings);draft.postTasks=settings.post.length?[{...clone(settings.post[0]),count:1,basis:'order'}]:[];}render();}return;}
  const button=event.target.closest('[data-action]');if(!button)return;
  if(button.dataset.action==='open-slicer'){openSlicer(Number(button.dataset.id));return;}
  if(button.dataset.action==='quick-estimate'){openQuickQuote(Number(button.dataset.id));return;}
  if(button.dataset.action==='popout-slicer'){const s=slicerSession;if(s){s.popup=window.open(`./slicer/#nacent=${s.token}`,'nacent-slicer-'+s.token);if(!s.popup)toast('Permita abrir a nova aba para usar a tela cheia.');}return;}
  if(button.dataset.action==='close-slicer'){slicerSession?.dialog.close();return;}
  if(button.dataset.action==='apply-slicer'){
    const s=slicerSession;if(!s?.result||draft.id!==s.quoteId||!draft.plates[s.index])return;
    applyPreparedResult(s);return;
  }
  const {action:a,id}=button.dataset;
  if(a==='quote-payment'){if(!leave())return;view='payback';dirty=false;paybackUI.render();await paybackUI.action('receive-quote',id);return;}
  if(a==='new-resin'){if(!leave())return;resinDraft={id:crypto.randomUUID(),brand:'',name:'',type:'',color:'',price:null,unit:'kg',density:1.15,stockKg:null,active:true};dirty=false;renderResins();return;}
  if(a==='edit-resin'){if(!leave())return;resinDraft=clone(settings.resins.find(r=>r.id===id));dirty=false;renderResins();return;}
  if(a==='cancel-resin'){resinDraft=null;dirty=false;renderResins();return;}
  if(a==='toggle-resin'){if(busy||!leave())return;busy=true;try{const next=clone(settings),r=next.resins.find(r=>r.id===id);r.active=r.active===false;if(!r.active&&next.defaultResinId===id)next.defaultResinId='';await saveResinSettings(next,'Disponibilidade da resina atualizada online.');resinDraft=null;renderResins();}catch(e){toast(e.message);}finally{busy=false;}return;}
  if(a==='add-paint-task'){draft.paintTasks??=[];draft.paintTasks.push({name:'',cost:0,count:1,basis:'piece',custom:true});dirty=true;render();return;}
  if(a==='demo'){store.demo();await refresh();return;}
  if(a==='new'){if(leave()){draft=newQuote(settings);draft.postTasks=settings.post.length?[{...clone(settings.post[0]),count:1,basis:'order'}]:[];view='calculator';dirty=false;render();}return;}
  if(a==='edit'){if(leave()){draft=clone(quotes.find(q=>q.id===id));view='calculator';dirty=false;render();}return;}
  if(a==='back'){if(leave()){view='quotes';dirty=false;render();}return;}
  if(a==='save'){await saveQuote();return;}
  if(a==='save-draft'){await saveQuote(false);return;}
  if(a==='remove-selected'){const [group,index]=id.split(':');draft[group].splice(Number(index),1);dirty=true;render();return;}
  if(a==='add-task'){draft.extraTasks??=[];draft.extraTasks.push({name:'',cost:0,count:1,basis:'order'});dirty=true;render();return;}
  if(a==='remove-task'){draft.extraTasks.splice(Number(id),1);dirty=true;render();return;}
  if(a==='add-service'){settingsDraft[id].push({name:'',cost:0});dirty=true;renderSettings();return;}
  if(a==='remove-service'){const [group,index]=id.split(':');settingsDraft[group].splice(Number(index),1);dirty=true;renderSettings();return;}
  if(a==='add-plate'){draft.plates.push(makePlate(settings,`Lote ${draft.plates.length+1}`));dirty=true;render();return;}
  if(a==='remove-plate'){draft.plates.splice(Number(id),1);dirty=true;render();return;}
  if(a==='duplicate'){if(!leave())return;draft=clone(draft);draft.id=crypto.randomUUID();draft.project+=' (cópia)';draft.date=today();draft.status='Rascunho';draft.revision=0;draft.result=null;dirty=true;render();return;}
  if(a==='print'){printQuote();return;}
  if(a==='backup'){download(`resina-studio-backup-${today()}.json`,JSON.stringify({version:2,exportedAt:new Date().toISOString(),settings,quotes,payback,production},null,2));toast('Backup exportado. Guarde o arquivo em um lugar seguro.');return;}
  if(a==='refresh'){await refresh();return;}
  if(a==='client-history'){search=id;filter='';view='quotes';render();return;}
  if(a==='logout'){if(leave()){try{await store.logout();dirty=false;quotes=[];production=clone(productionDefaults);payback={version:1,entries:[],source:null,revision:0};settings=clone(defaults);login();}catch(e){toast('Não foi possível sair. Tente novamente.');}}}
});
document.addEventListener('input',event=>{
  if(event.target.closest('#resin-form')&&event.target.name){const t=event.target;resinDraft[t.name]=t.type==='number'?(t.value===''?null:Number(t.value)):t.value;dirty=true;updateResinConversion();return;}
  if(event.target.id==='search'){search=event.target.value;document.querySelector('#quote-list').innerHTML=quoteTable(filtered([...quotes].sort((a,b)=>b.date.localeCompare(a.date))));return;}
  if(event.target.closest('#quote-form')&&event.target.name){absorbQuoteField(event.target);}
  if(event.target.closest('#settings-form')){const t=event.target;const numeric=t.type==='number';if(t.name)setPath(settingsDraft,t.name,numeric?(t.value===''?null:Number(t.value)):t.value);dirty=true;}
});
document.addEventListener('change',async event=>{
  if(event.target.matches('[data-pb-month],[data-pb-voided]')){paybackUI.change(event);return;}
  if(event.target.dataset.resinPlate!==undefined){const p=draft.plates[Number(event.target.dataset.resinPlate)],id=event.target.value,r=(settings.resins??[]).find(r=>r.id===id);p.resinId=id;p.resinSnapshot=r?resinSnapshot(r):null;if(r){p.pricePerLiter=resinPerLiter(r);p.resinMode='volume';}else if(id!=='__manual__'){p.pricePerLiter=0;p.resinMode='volume';}dirty=true;render();return;}
  if(event.target.id==='resin-default'){if(busy)return;busy=true;try{const next=clone(settings);next.defaultResinId=event.target.value;await saveResinSettings(next,'Resina padrão salva online.');renderResins();}catch(e){toast(e.message);}finally{busy=false;}return;}
  const group=event.target.dataset.serviceGroup;if(group){if(event.target.value!==''){const catalog=group==='prep'?draft.settings.prep:group==='paintTasks'?(settings.paint??[]):draft.settings.post;draft[group]??=[];draft[group].push({...clone(catalog[Number(event.target.value)]),count:1,basis:'order'});dirty=true;render();}return;}
  if(event.target.id==='status-filter'){filter=event.target.value;document.querySelector('#quote-list').innerHTML=quoteTable(filtered([...quotes].sort((a,b)=>b.date.localeCompare(a.date))));return;}
  if(event.target.closest('#quote-form')){absorbQuoteField(event.target);if(event.target.name.endsWith('.resinMode')||event.target.name==='paintEnabled'||event.target.name==='task-choice')render();}
});
document.addEventListener('submit',async event=>{
  event.preventDefault();
  if(event.target.id==='resin-form'){await saveResin();return;}
  if(event.target.id==='quote-form'){await saveQuote();return;}
  if(event.target.id==='login-form'){
    const data=new FormData(event.target);const button=event.target.querySelector('button');button.disabled=true;button.textContent='Entrando…';
    try{await store.login(data.get('email'),data.get('password'));await refresh();}catch(error){login(error.message);}return;
  }
  if(event.target.id==='settings-form'){
    if(busy)return;busy=true;
    try {
      const next=clone(settingsDraft);for(const [key,value] of new FormData(event.target)){const numeric=['validity','losses','machine','minimum','rate','resinPerLiter'].includes(key)||key.endsWith('.cost');setPath(next,key,numeric?Number(value):value);}
      if(!next.business.trim())throw Error('Informe o nome do ateliê.');
      for(const group of ['prep','post','paint']){const seen=new Set();for(const item of next[group]){item.name=item.name.trim();if(!item.name)throw Error('Dê um nome a cada tarefa.');if(seen.has(item.name.toLowerCase()))throw Error('Use nomes diferentes para as tarefas da mesma tabela.');seen.add(item.name.toLowerCase());if(!Number.isFinite(item.cost)||item.cost<0)throw Error('Confira o custo da tarefa.');}}

      const test=newQuote(next);calculate(test);if(!Number.isInteger(next.validity)||next.validity<1)throw Error('Confira a validade padrão.');
      await store.save('settings',next);settings=next;settingsDraft=null;dirty=false;render();toast(store.mode==='cloud'?'Configurações salvas online.':'Configurações salvas na demonstração.');
    }catch(error){toast(error.message);}finally{busy=false;}
  }
});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
try {await store.initialize();if(store.user)await refresh();else login();}catch(error){login('Não foi possível conectar. Confira a conexão e tente novamente.');}


</script></body></html>
