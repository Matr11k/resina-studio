<body><div id="app"><div class="loading">Preparando seu ateliê…</div></div><div id="toast" role="status" aria-live="polite"></div><div id="print-area"></div><script type="module">// Apenas URL e chave PUBLICÁVEL/anon. Nunca use service_role ou chave secreta.
const cloudConfig = { url: 'https://bitpvroagwyblnnihqut.supabase.co', key: 'sb_publishable_TyMLTIQmfJqmMt8gkZZMLw_kDWa_5RA' };

const statuses = ['Rascunho', 'Enviado', 'Aprovado', 'Em produção', 'Concluído', 'Recusado', 'Expirado'];
const defaults = {
  business: 'Nacent', contact: '', currency: 'EUR', losses: 1.25,
  machine: 0.60, rate: 35, pricing: 'markup', minimum: 10,
  validity: 15, resinName: '', resinPerLiter: 0,
  prep: [
    {name:'Pré-suportado / pronto',cost:0}, {name:'Suportes simples',cost:3},
    {name:'Suportes manuais / trabalhosos',cost:6.5}, {name:'Hollow + furos',cost:4.5},
    {name:'Dividir / corrigir modelo',cost:10}, {name:'Modelagem simples / modificação 3D',cost:8}
  ],
  post: [{name:'Simples',cost:3},{name:'Médio / detalhado',cost:5},{name:'Grande / muitos suportes',cost:8},{name:'Personalizado',cost:10}]
};
const clone = v => structuredClone(v);
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function newQuote(settings=defaults) {
  return { id:crypto.randomUUID(), project:'', client:'', contact:'', date:today(), status:'Rascunho', quantity:1,
    plates:[{label:'Lote 1',runs:1,hours:0,resinMode:'slicer',resinCost:0,volume:0,pricePerLiter:settings.resinPerLiter}],
    prep:[],post:0,postTasks:[],extraTasks:[],postMode:'order',extras:0,shippingCost:0,shippingCharge:0,market:null,finalPrice:null,notes:'',
    settings:clone(settings), validity:settings.validity, result:null, revision:0 };
}
function number(v,label,min=0,integer=false) {
  if(v===null||v===undefined||v===''||!Number.isFinite(Number(v))) throw Error(`Informe ${label}.`);
  const n=Number(v); if(n<min||(integer&&!Number.isInteger(n))) throw Error(`Confira ${label}.`); return n;
}
function calculate(q) {
  const s=q.settings;
  const quantity=number(q.quantity,'a quantidade de peças',1,true);
  const factor=number(s.losses,'o fator de perdas',1);
  const machineRate=number(s.machine,'o custo de máquina');
  const rate=number(s.rate,'o percentual')/100;
  if(!['markup','margin'].includes(s.pricing)) throw Error('Escolha como calcular o lucro.');
  if(s.pricing==='margin'&&rate>=1) throw Error('A margem sobre venda precisa ser menor que 100%.');
  if(!q.plates?.length) throw Error('Adicione pelo menos um lote.');
  let resin=0,machine=0,hours=0;
  for(const p of q.plates) {
    const runs=number(p.runs,'o número de repetições do lote',1,true);
    const time=number(p.hours,'o tempo do lote');
    let raw;
    if(p.resinMode==='volume') {
      const volume=number(p.volume,'o volume de resina');
      const price=number(p.pricePerLiter,'o preço da resina por litro');
      if(volume>0&&price<=0) throw Error('Informe o preço por litro para calcular pela quantidade de resina.');
      raw=volume*price/1000;
    } else if(p.resinMode==='slicer') raw=number(p.resinCost,'o custo de resina no slicer');
    else throw Error('Escolha a origem do custo de resina.');
    resin+=raw*factor*runs; hours+=time*runs; machine+=time*runs*machineRate;
  }
  const taskCost=(v)=>number(v.cost,'o custo da tarefa')*number(v.count??1,'a quantidade da tarefa',1,true)*(v.basis==='piece'?quantity:1);
  const prep=(q.prep??[]).reduce((sum,v)=>sum+taskCost(v),0);
  const post=Array.isArray(q.postTasks)?q.postTasks.reduce((sum,v)=>sum+taskCost(v),0):number(q.post,'o custo do acabamento')*(q.postMode==='piece'?quantity:1);
  const extras=number(q.extras,'os custos extras')+(q.extraTasks??[]).reduce((sum,v)=>sum+taskCost(v),0);
  const shippingCost=number(q.shippingCost,'o custo de envio');
  const shippingCharge=number(q.shippingCharge,'o frete cobrado');
  const cost=resin+machine+prep+post+extras;
  const cents=value=>Math.round((value+Number.EPSILON)*100)/100;
  const suggested=cents(Math.max(number(s.minimum,'o pedido mínimo'),s.pricing==='margin'?cost/(1-rate):cost*(1+rate)));
  const chosen=q.finalPrice===null||q.finalPrice===''||q.finalPrice===undefined?suggested:cents(number(q.finalPrice,'o preço final'));
  const revenue=chosen+shippingCharge;
  const profit=revenue-cost-shippingCost;
  const market=q.market===null||q.market===''||q.market===undefined?null:number(q.market,'o preço de mercado')*quantity;
  return {resin,machine,hours,prep,post,extras,cost,suggested,chosen,shippingCost,shippingCharge,total:revenue,
    profit,margin:revenue>0?profit/revenue:null,unit:chosen/quantity,costUnit:cost/quantity,market,
    difference:market===null?null:chosen-market,minimumApplied:suggested===Number(s.minimum)};
}
function validateQuote(q) {
  if(!String(q.project??'').trim()) throw Error('Dê um nome ao projeto.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(q.date??'')) throw Error('Informe a data do orçamento.');
  if(!statuses.includes(q.status)) throw Error('Confira o status.');
  number(q.validity,'a validade em dias',1,true);
  for(const task of q.extraTasks??[])if(!String(task.name??'').trim())throw Error('Dê um nome às tarefas personalizadas.');
  return calculate(q);
}
function quoteTotal(q) {return q.result??calculate(q);}
const closed = q => ['Aprovado','Em produção','Concluído'].includes(q.status);
function expiryDate(q) {
  const d=new Date(`${q.date}T12:00:00`);d.setDate(d.getDate()+Number(q.validity??15));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function effectiveStatus(q,asOf=today()) {
  return q.status==='Enviado'&&expiryDate(q)<asOf?'Expirado':q.status;
}

class Store {
  constructor() {this.mode='none';this.client=null;this.user=null;this.rows=new Map();}
  get configured() {return Boolean(cloudConfig.url&&cloudConfig.key);}
  async initialize() {
    if(!this.configured)return;
    const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.102.0');
    this.client=createClient(cloudConfig.url,cloudConfig.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const {data,error}=await this.client.auth.getSession();if(error)throw error;
    this.user=data.session?.user??null;
    if(this.user)this.mode='cloud';
  }
  async login(email,password) {
    const {data,error}=await this.client.auth.signInWithPassword({email,password});
    if(error)throw Error('Não foi possível entrar. Confira seu e-mail e senha.');
    this.user=data.user;this.mode='cloud';
  }
  async logout() {if(this.mode==='cloud'){const {error}=await this.client.auth.signOut();if(error)throw error;}this.mode='none';this.user=null;this.rows.clear();}
  demo() {this.mode='demo';this.rows.clear();}
  async load() {
    if(this.mode==='demo')return JSON.parse(localStorage.getItem('resina-demo-v1')||'{"quotes":[],"settings":null}');
    if(this.mode!=='cloud')throw Error('Entre para carregar seus dados.');
    let rows=[];
    for(let offset=0;;offset+=500){
      const {data,error}=await this.client.from('resina_records').select('*').eq('owner_id',this.user.id).order('id').range(offset,offset+499);
      if(error)throw Error('Não foi possível carregar o banco online. Tente atualizar.');
      rows.push(...data);if(data.length<500)break;
    }
    this.rows=new Map(rows.map(r=>[r.id,r]));
    return {settings:rows.find(r=>r.kind==='settings')?.payload??null,quotes:rows.filter(r=>r.kind==='quote').map(r=>({...r.payload,revision:r.revision}))};
  }
  async save(kind,payload,expectedRevision=0) {
    if(this.mode==='demo') {
      const db=await this.load();
      if(kind==='settings')db.settings=payload;
      else {const i=db.quotes.findIndex(q=>q.id===payload.id);const next={...payload,revision:expectedRevision+1};if(i<0)db.quotes.push(next);else db.quotes[i]=next;}
      localStorage.setItem('resina-demo-v1',JSON.stringify(db));return expectedRevision+1;
    }
    if(this.mode!=='cloud')throw Error('Entre para salvar online.');
    const id=kind==='settings'?'settings':payload.id;
    const previous=this.rows.get(id);
    const revision=kind==='settings'?(previous?.revision??0):expectedRevision;
    let response;
    if(previous||revision>0) response=await this.client.from('resina_records').update({payload,revision:revision+1}).eq('id',id).eq('owner_id',this.user.id).eq('revision',revision).select();
    else response=await this.client.from('resina_records').insert({id,owner_id:this.user.id,kind,payload,revision:1}).select();
    if(response.error)throw Error('Não foi possível salvar online. Seus campos continuam nesta tela.');
    if(!response.data?.length)throw Error('Este registro mudou em outro aparelho. Atualize antes de continuar.');
    this.rows.set(id,response.data[0]);return response.data[0].revision;
  }
}

  updateResult();

function updateResult() {
  const element=document.querySelector('#result');if(!element)return;
  try {
    const r=calculate(draft);
    element.innerHTML=`<div class="result-card"><p class="eyebrow">SEU ORÇAMENTO, AO VIVO</p><span class="result-label">Total para o cliente</span><strong class="result-total">${money(r.total)}</strong><p>${money(r.unit)} / peça <span>+ ${money(r.shippingCharge)} de frete</span></p><div class="result-profit"><span>Lucro estimado</span><b class="${r.profit<0?'negative':''}">${money(r.profit)}</b><small>Margem efetiva: ${percent(r.margin)}</small></div><div class="breakdown">${[['Resina + perdas',r.resin],['Máquina',r.machine],['Preparação STL',r.prep],['Pós-processamento',r.post],['Extras / embalagem',r.extras]].map(([l,v])=>`<div><span>${l}</span><b>${money(v)}</b></div>`).join('')}<div class="subtotal"><span>Custo de produção</span><b>${money(r.cost)}</b></div><div><span>Preço sugerido sem frete</span><b>${money(r.suggested)}</b></div><div><span>Custo do envio</span><b>${money(r.shippingCost)}</b></div></div>${r.profit<0?'<div class="notice error">Este preço gera prejuízo. Reveja o valor antes de enviar.</div>':''}${r.minimumApplied?'<div class="result-hint">Pedido mínimo aplicado.</div>':''}${r.market!==null?`<div class="result-hint">${r.difference>=0?'Acima':'Abaixo'} da referência de mercado: ${money(Math.abs(r.difference))}</div>`:''}<button class="btn lime wide" type="submit">${busy?'Salvando…':'Finalizar orçamento →'}</button>${action('Imprimir / salvar PDF','print','btn ghost wide')}${draft.revision?action('Duplicar orçamento','duplicate','text-btn wide',draft.id):''}</div><div class="formula-note"><b>${draft.settings.pricing==='markup'?'Acréscimo sobre custo':'Margem sobre venda'}</b><p>${draft.settings.pricing==='markup'?'Custo × (1 + percentual). Um acréscimo de 35% corresponde a uma margem de 25,9% antes do frete.':'Custo ÷ (1 − percentual). A margem é a parcela do preço de venda que sobra após os custos.'}</p></div>`;
  }catch(error){element.innerHTML=`<div class="result-card"><h2>Confira os valores</h2><p>${esc(error.message)}</p></div>`;}
}
function setPath(target,path,value) {const keys=path.split('.');let parent=target;for(const k of keys.slice(0,-1))parent=parent[k];parent[keys.at(-1)]=value;}
function absorbQuoteField(target) {
  if(target.name==='task-choice'){
    const group=target.dataset.group,index=Number(target.value),catalog=group==='prep'?draft.settings.prep:draft.settings.post;
    draft[group]??=[];
    if(target.checked&&!draft[group].some(x=>x.name===catalog[index].name))draft[group].push({...clone(catalog[index]),count:1,basis:'order'});
    if(!target.checked)draft[group]=draft[group].filter(x=>x.name!==catalog[index].name);
  }
  else if(target.name){const value=target.type==='number'?(target.value===''?null:Number(target.value)):target.value;setPath(draft,target.name,value);}
  dirty=true;updateResult();
}
function renderSettings() {
  settingsDraft??=clone(settings);const edit=settingsDraft;
  shell(`<form id="settings-form"><section class="panel form-panel"><div class="section-title"><span>01</span><div><h2>Identidade do ateliê</h2><p>Esses dados aparecem no orçamento do cliente.</p></div></div><div class="fields">${input('Nome do ateliê','business',edit.business,'text','required')}${input('Seu contato','contact',edit.contact)}${input('Validade padrão (dias)','validity',edit.validity,'number','min="1" step="1" required')}</div></section><section class="panel form-panel"><div class="section-title"><span>02</span><div><h2>Custos e preço padrão</h2><p>Valores de partida para os próximos projetos.</p></div></div><div class="fields">${input('Fator de perdas de resina','losses',edit.losses,'number','min="1" step="0.01" required')}${input('Custo da máquina (€/hora)','machine',edit.machine,'number','min="0" step="0.01" required')}${input('Pedido mínimo (€)','minimum',edit.minimum,'number','min="0" step="0.01" required')}${select('Cálculo padrão','pricing',edit.pricing,[{value:'markup',label:'Acréscimo sobre custo'},{value:'margin',label:'Margem sobre venda'}])}${input('Percentual padrão (%)','rate',edit.rate,'number','min="0" step="0.1" required')}${input('Nome da resina habitual','resinName',edit.resinName)}${input('Preço da resina habitual (€/litro)','resinPerLiter',edit.resinPerLiter,'number','min="0" step="0.01" required')}</div><div class="inline-info">O custo da máquina pode incluir eletricidade, desgaste do filme, LCD e manutenção. Não inclua esses custos novamente nos extras.</div></section><section class="panel form-panel"><h2>Tabela de serviços</h2><p class="muted">Preparação de arquivo e pós-processamento.</p>${['prep','post'].map(kind=>`<h3 class="task-title">${kind==='prep'?'Preparação STL':'Pós-processamento'}</h3><div class="service-prices">${edit[kind].map((p,i)=>`<div class="service-edit">${input('Nome da tarefa',`${kind}.${i}.name`,p.name,'text','required')}${input('Custo padrão (€)',`${kind}.${i}.cost`,p.cost,'number','min="0" step="0.01" required')}${action('Remover','remove-service','text-btn',`${kind}:${i}`)}</div>`).join('')}</div>${action('＋ Criar item','add-service','btn secondary',kind)}`).join('')}</section><div class="form-end"><button type="submit" class="btn primary">Salvar configurações</button></div></form>`,'Do seu jeito.','Defina seus custos uma vez e reaproveite nos próximos orçamentos.',action('Exportar backup','backup'));
}
async function saveQuote(finalize=true) {
  if(busy)return;
  try {
    const pending=clone(draft);if(finalize&&pending.status==='Rascunho')pending.status='Enviado';
    const result=validateQuote(pending);busy=true;updateResult();
    const payload={...pending,project:pending.project.trim(),client:pending.client.trim(),result,updatedAt:new Date().toISOString()};
    const revision=await store.save('quote',payload,draft.revision);
    payload.revision=revision;const i=quotes.findIndex(x=>x.id===payload.id);if(i<0)quotes.push(payload);else quotes[i]=payload;
    draft=payload;dirty=false;view='quotes';render();toast(store.mode==='cloud'?'Orçamento salvo online.':'Orçamento salvo nesta demonstração local.');
  }catch(error){toast(error.message);}finally{busy=false;}
}
function download(name,data,type='application/json'){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printQuote() {
  try {
    const q=draft,r=validateQuote(q);
    const validity=Number(q.validity);if(!Number.isInteger(validity)||validity<1)throw Error('Confira a validade do orçamento.');
    const end=new Date(`${q.date}T12:00:00`);end.setDate(end.getDate()+validity);
    document.querySelector('#print-area').innerHTML=`<header><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23162d28%22%2F%3E%3Cpath%20d%3D%22M32%2010%2051%2021v22L32%2054%2013%2043V21z%22%20fill%3D%22none%22%20stroke%3D%22%23c1dd85%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22m13%2021%2019%2011%2019-11M32%2032v22%22%20fill%3D%22none%22%20stroke%3D%22%23c1dd85%22%20stroke-width%3D%224%22%2F%3E%3C%2Fsvg%3E%0A" alt=""><div><h1>${esc(q.settings.business)}</h1><p>${esc(q.settings.contact)}</p></div><b>ORÇAMENTO</b></header><div class="print-meta"><div><p>Preparado para</p><h2>${esc(q.client||'Cliente')}</h2><p>${esc(q.contact)}</p></div><div><p>Emissão: ${fmtDate(q.date)}</p><p>Válido até: ${end.toLocaleDateString('pt-PT')}</p></div></div><h2>${esc(q.project)}</h2><table><thead><tr><th>Descrição</th><th>Quantidade</th><th>Preço por peça</th><th>Total</th></tr></thead><tbody><tr><td>Impressão 3D em resina</td><td>${q.quantity}</td><td>${money(r.unit)}</td><td>${money(r.chosen)}</td></tr><tr><td colspan="3">Frete / entrega</td><td>${money(r.shippingCharge)}</td></tr></tbody></table><div class="print-total">Total <b>${money(r.total)}</b></div>${q.notes?`<h3>Observações</h3><p class="print-notes">${esc(q.notes)}</p>`:''}<footer>Valores em euros. Orçamento comercial; não substitui uma fatura.</footer>`;
    window.print();
  }catch(error){toast(error.message);}
}
async function refresh() {
  if(dirty&&!confirm('Você tem alterações não salvas. Descartar e atualizar os dados?'))return;
  try {const db=await store.load();settings=db.settings?{...clone(defaults),...db.settings}:clone(defaults);quotes=db.quotes;dirty=false;view='calculator';draft=newQuote(settings);draft.postTasks=settings.post.length?[{...clone(settings.post[0]),count:1,basis:'order'}]:[];render();}catch(error){toast(error.message);}
}
function leave(){return !dirty||confirm('Há alterações não salvas. Descartar essas alterações?');}
setInterval(()=>{if(store.mode!=='none'&&['dashboard','quotes','clients'].includes(view))render();},60000);
document.addEventListener('click',async event=>{
  const nav=event.target.closest('[data-view]');if(nav){if(leave()){view=nav.dataset.view;dirty=false;settingsDraft=null;if(view==='calculator'){draft=newQuote(settings);draft.postTasks=settings.post.length?[{...clone(settings.post[0]),count:1,basis:'order'}]:[];}render();}return;}
  const button=event.target.closest('[data-action]');if(!button)return;
  const {action:a,id}=button.dataset;
  if(a==='demo'){store.demo();await refresh();return;}
  if(a==='new'){if(leave()){draft=newQuote(settings);draft.postTasks=settings.post.length?[{...clone(settings.post[0]),count:1,basis:'order'}]:[];view='calculator';dirty=false;render();}return;}
  if(a==='edit'){if(leave()){draft=clone(quotes.find(q=>q.id===id));view='calculator';dirty=false;render();}return;}
  if(a==='back'){if(leave()){view='quotes';dirty=false;render();}return;}
  if(a==='save'){await saveQuote();return;}
  if(a==='save-draft'){await saveQuote(false);return;}
  if(a==='add-task'){draft.extraTasks??=[];draft.extraTasks.push({name:'',cost:0,count:1,basis:'order'});dirty=true;render();return;}
  if(a==='remove-task'){draft.extraTasks.splice(Number(id),1);dirty=true;render();return;}
  if(a==='add-service'){settingsDraft[id].push({name:'',cost:0});dirty=true;renderSettings();return;}
  if(a==='remove-service'){const [group,index]=id.split(':');settingsDraft[group].splice(Number(index),1);dirty=true;renderSettings();return;}
  if(a==='add-plate'){draft.plates.push({label:`Lote ${draft.plates.length+1}`,runs:1,hours:0,resinMode:'slicer',resinCost:0,volume:0,pricePerLiter:settings.resinPerLiter});dirty=true;render();return;}
  if(a==='remove-plate'){draft.plates.splice(Number(id),1);dirty=true;render();return;}
  if(a==='duplicate'){if(!leave())return;draft=clone(draft);draft.id=crypto.randomUUID();draft.project+=' (cópia)';draft.date=today();draft.status='Rascunho';draft.revision=0;draft.result=null;dirty=true;render();return;}
  if(a==='print'){printQuote();return;}
  if(a==='backup'){download(`resina-studio-backup-${today()}.json`,JSON.stringify({version:1,exportedAt:new Date().toISOString(),settings,quotes},null,2));toast('Backup exportado. Guarde o arquivo em um lugar seguro.');return;}
  if(a==='refresh'){await refresh();return;}
  if(a==='client-history'){search=id;filter='';view='quotes';render();return;}
  if(a==='logout'){if(leave()){try{await store.logout();dirty=false;quotes=[];settings=clone(defaults);login();}catch(e){toast('Não foi possível sair. Tente novamente.');}}}
});
document.addEventListener('input',event=>{
  if(event.target.id==='search'){search=event.target.value;document.querySelector('#quote-list').innerHTML=quoteTable(filtered([...quotes].sort((a,b)=>b.date.localeCompare(a.date))));return;}
  if(event.target.closest('#quote-form')){absorbQuoteField(event.target);}
  if(event.target.closest('#settings-form')){const t=event.target;const numeric=t.type==='number';if(t.name)setPath(settingsDraft,t.name,numeric?(t.value===''?null:Number(t.value)):t.value);dirty=true;}
});
document.addEventListener('change',event=>{
  if(event.target.id==='status-filter'){filter=event.target.value;document.querySelector('#quote-list').innerHTML=quoteTable(filtered([...quotes].sort((a,b)=>b.date.localeCompare(a.date))));return;}
  if(event.target.closest('#quote-form')){absorbQuoteField(event.target);if(event.target.name.endsWith('.resinMode')||event.target.name==='task-choice')render();}
});
document.addEventListener('submit',async event=>{
  event.preventDefault();
  if(event.target.id==='quote-form'){await saveQuote();return;}
  if(event.target.id==='login-form'){
    const data=new FormData(event.target);const button=event.target.querySelector('button');button.disabled=true;button.textContent='Entrando…';
    try{await store.login(data.get('email'),data.get('password'));await refresh();}catch(error){login(error.message);}return;
  }
  if(event.target.id==='settings-form'){
    if(busy)return;busy=true;
    try {
      const next=clone(settingsDraft);for(const [key,value] of new FormData(event.target)){const numeric=['validity','losses','machine','minimum','rate','resinPerLiter'].includes(key)||key.endsWith('.cost');setPath(next,key,numeric?Number(value):value);}
      if(!next.business.trim())throw Error('Informe o nome do ateliê.');
      for(const group of ['prep','post']){const seen=new Set();for(const item of next[group]){item.name=item.name.trim();if(!item.name)throw Error('Dê um nome a cada tarefa.');if(seen.has(item.name.toLowerCase()))throw Error('Use nomes diferentes para as tarefas da mesma tabela.');seen.add(item.name.toLowerCase());if(!Number.isFinite(item.cost)||item.cost<0)throw Error('Confira o custo da tarefa.');}}

      const test=newQuote(next);calculate(test);if(!Number.isInteger(next.validity)||next.validity<1)throw Error('Confira a validade padrão.');
      await store.save('settings',next);settings=next;settingsDraft=null;dirty=false;render();toast(store.mode==='cloud'?'Configurações salvas online.':'Configurações salvas na demonstração.');
    }catch(error){toast(error.message);}finally{busy=false;}
  }
});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
try {await store.initialize();if(store.user)await refresh();else login();}catch(error){login('Não foi possível conectar. Confira a conexão e tente novamente.');}


</script></body></html>
